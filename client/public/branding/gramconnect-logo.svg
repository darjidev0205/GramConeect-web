<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d1ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mark Icon Group -->
  <g transform="translate(10, 10)">
    <path d="M 48 16 A 23 23 0 1 0 52 48 L 36 48 L 36 35 L 55 35" 
          stroke="url(#logoGrad)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M 23 26 A 14 14 0 0 1 48 26" 
          stroke="#38bdf8" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-dasharray="3 2" 
          opacity="0.85" />
    <circle cx="23" cy="26" r="3.5" fill="#22d1ee" filter="url(#logoGlow)" />
    <circle cx="48" cy="26" r="3.5" fill="#3b82f6" filter="url(#logoGlow)" />
    <circle cx="55" cy="35" r="4" fill="#38bdf8" filter="url(#logoGlow)" />
  </g>

  <!-- Wordmark Text -->
  <text x="95" y="44" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="3">GRAMCONNECT</text>
  <text x="96" y="64" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="2.5" opacity="0.9">RURAL LOGISTICS ENGINE</text>
</svg>

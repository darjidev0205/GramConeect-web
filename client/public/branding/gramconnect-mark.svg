<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d1ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="gcGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stylized Connected Network 'G' Outer Path -->
  <path d="M 68 24 A 32 32 0 1 0 74 68 L 52 68 L 52 50 L 78 50" 
        stroke="url(#gcGrad1)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner Connectivity Arc (Village -> Hub Line) -->
  <path d="M 32 38 A 20 20 0 0 1 68 38" 
        stroke="url(#gcGrad2)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-dasharray="4 3" 
        opacity="0.85" />

  <!-- Village Node Point -->
  <circle cx="32" cy="38" r="5" fill="#22d1ee" filter="url(#nodeGlow)" />
  
  <!-- Hub Node Point -->
  <circle cx="68" cy="38" r="5" fill="#3b82f6" filter="url(#nodeGlow)" />

  <!-- Center Destination Node Point -->
  <circle cx="78" cy="50" r="5.5" fill="#38bdf8" filter="url(#nodeGlow)" />
</svg>
